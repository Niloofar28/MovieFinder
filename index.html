<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فیلم‌یاب - جستجو و کشف فیلم‌های جدید</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

    <header class="main-header">
    </header>

    <main class="main-content">
        <section class="hero-section container">
            
            <h2 class="hero-title">فیلم و سریال مورد نظر خود را جستجو کنید</h2>
            
            
            <div class="search-container">
                <form id="search-form" class="search-form">
                    <input type="text" id="search-input" placeholder="عنوان فیلم یا سریال مورد نظر را جستجو کنید..." required>
                    <button type="submit">🔍</button>
                </form>
                
                <div id="search-results-dropdown" class="search-dropdown" style="display: none;">
                    </div>
            </div>
            
        </section>
        
        <section class="movie-list-section container">
            <h2 class="section-title">🔥 فیلم‌های پرطرفدار روز</h2>
            
            <div id="loading-indicator" class="status-message loading-state">
                <div class="spinner"></div>
                <p>در حال بارگذاری فیلم‌های داغ...</p>
            </div>

            <div id="error-message" class="status-message error-state" style="display:none;">
            
            </div>
            
            <div id="empty-state-message" class="status-message empty-state" style="display:none;">
                <h3>فیلمی یافت نشد!</h3>
                <p>متأسفانه، در حال حاضر فیلم پرطرفداری برای نمایش وجود ندارد.</p>
            </div>

            <div id="trending-movies-container" class="movie-grid">
                </div>
        </section>
        <section id="trending-movies-container" class="movies-grid">
    </section>
<section class="movie-list">
    </section>

<div id="pagination-controls-index" class="pagination-container">
    </div>

    </main>
    
    <footer class="main-footer">
    </footer>

    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/genre-results.js"></script>
</body>
</html>
