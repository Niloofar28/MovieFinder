# Base44 dev environment.
#
# The site is a static multi-page app: HTML, CSS and browser ES modules with no
# build step and no backend. nginx serves ./public directly from the working
# tree, so every edit is live on a browser refresh — no rebuild, no watcher.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      # The user-facing preview entry point.
      - "3000:80"
    volumes:
      # Only the publishable site is exposed — repo metadata, docs and .git stay
      # out of the web root.
      - ./public:/usr/share/nginx/html:ro
      # No-cache headers: an edit must never be masked by a stale module.
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
