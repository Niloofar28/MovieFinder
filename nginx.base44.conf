# nginx config for the Base44 dev server.
#
# The site has no build step, so the browser must never reuse a cached module
# after an edit — a stale /js/main.js silently breaks the whole page. Revalidate
# on every request instead.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
